<!DOCTYPE html>
<html lang="en-us">

<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Odysape</title>
`	<link rel="stylesheet" href="style.css">
	<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>
	<div id="gameContainer">
		<canvas id="unity-canvas" width="1080" height="1920" data-pixel-art=""></canvas>
		<script src="Build/93953c33a0c6af27abb729f631596019.loader.js"></script>
		<script>
			let canvas = document.querySelector("#unity-canvas");
			let config = {
				dataUrl: "Build/44de98e4cb631f04fd50de700a068cdf.data.gz",
				frameworkUrl: "Build/c6fe917453e3e4060986f5691f722c2f.framework.js.gz",
				codeUrl: "Build/9d60a5cba828a4a0ae8b3f0e95cdf5cd.wasm.gz",
				streamingAssetsUrl: "StreamingAssets",
				companyName: "Jinx",
				productName: "Odysape",
				productVersion: "0.4.1",
				autoSyncPersistentDataPath: true,
			};

			let scaleToFit;
			try {
				scaleToFit = !!JSON.parse("");
			} catch (e) {
				scaleToFit = true;
			}
			function progressHandler(progress) {
				var percent = progress * 100 + '%';
				canvas.style.background = 'linear-gradient(to right, white, white ' + percent + ', transparent ' + percent + ', transparent) no-repeat center';
				canvas.style.backgroundSize = '100% 1rem';
			}
			function onResize() {
				let container = canvas.parentElement;
				let w;
				let h;

				if (scaleToFit) {
					w = window.innerWidth;
					h = window.innerHeight;

					var r = 1920 / 1080;

					if (w * r > window.innerHeight) {
						w = Math.min(w, Math.ceil(h / r));
					}
					h = Math.floor(w * r);
				} else {
					w = 1080;
					h = 1920;
				}

				container.style.width = canvas.style.width = w + "px";
				container.style.height = canvas.style.height = h + "px";
				container.style.top = Math.floor((window.innerHeight - h) / 2) + "px";
				container.style.left = Math.floor((window.innerWidth - w) / 2) + "px";
				window.focus();
			}
			// Get Telegram user data
			let tg = window.Telegram.WebApp;
			let  user = tg.initDataUnsafe.user; // may be undefined if not inside Telegram
			let unityInstance = null;

			createUnityInstance(canvas, config, progressHandler).then(function (instance) {
				unityInstance = instance; // save globally
				canvas = instance.Module.canvas;

				if (user) {
					unityInstance.SendMessage("Bridge", "ReceiveUserInfo", JSON.stringify(user));
				} else {
					console.warn("Not running inside Telegram Mini App");
				}

				onResize();
			});
			window.addEventListener('resize', onResize);
			onResize();

			if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
				// Mobile device style: fill the whole browser client area with the game canvas:
				const meta = document.createElement('meta');
				meta.name = 'viewport';
				meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
				document.getElementsByTagName('head')[0].appendChild(meta);
			}
		</script>
	</div>
</body>

</html>
