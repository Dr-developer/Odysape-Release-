<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Odysape</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script> <!-- Telegram WebApp SDK -->
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <canvas id="unity-canvas" width=1080 height=1920 tabindex="-1" style="width: 1080px; height: 1920px; background: url('Build/8b0318c637dc3a12b43d420541bcfc49.jpg') center / cover"></canvas>
    <script src="Build/9a91b11e8b767e48502ea3836ff9d223.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      }
      let tg = window.Telegram.WebApp;
      let user = tg.initDataUnsafe.user;
      console.log(user);
      
      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/ff5f760c132c650b690fd45df27a55d6.data",
        frameworkUrl: "Build/35338515f30aba286685904ea2ffeb49.framework.js",
        codeUrl: "Build/580a8eb5a86440a387bce1ec365732e9.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Jinx",
        productName: "Odysape",
        productVersion: "0.2.1.2",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then((unityInstance) => {    if (user) {
        // Send Telegram user to Unity
        unityInstance.SendMessage("Bridge", "ReceiveUserInfo", JSON.stringify(user));
      } else {
        console.warn("Not running inside Telegram Mini App");
      }
      });
    </script>
  </body>
</html>
