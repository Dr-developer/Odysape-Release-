<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Odysape</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script> <!-- Telegram WebApp SDK -->
  </head>
  <body style="text-align: center; padding: 0; border: 0; margin: 0;">
    <canvas id="unity-canvas" width=1080 height=1920 tabindex="-1" style="width: 1080px; height: 1920px; background: #231F20"></canvas>
    <script src="Build/57cf5ed0578a331c97da002e327c7eb6.loader.js"></script>
    <script>
      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);

        var canvas = document.querySelector("#unity-canvas");
        canvas.style.width = "100%";
        canvas.style.height = "100%";
        canvas.style.position = "fixed";

        document.body.style.textAlign = "left";
      }

      // Get Telegram user data
      let tg = window.Telegram.WebApp;
      let user = tg.initDataUnsafe.user; // may be undefined if not inside Telegram
      console.log(user);
      // Create Unity instance
       createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
        dataUrl: "Build/3e754a81dd3152488b90b9f36ab40dc5.data",
        frameworkUrl: "Build/35338515f30aba286685904ea2ffeb49.framework.js",
        codeUrl: "Build/79d1969ad84e717069aea749e4a20e3b.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Jinx",
        productName: "Odysape",
        productVersion: "0.2.1.2",
        // matchWebGLToCanvasSize: false, // Uncomment this to separately control WebGL canvas render size and DOM element size.
        // devicePixelRatio: 1, // Uncomment this to override low DPI rendering on high DPI displays.
      }).then((unityInstance) => {
        if (user) {
          // Send Telegram user to Unity
          unityInstance.SendMessage("Bridge", "ReceiveUserInfo", JSON.stringify(user));
        } else {
          console.warn("Not running inside Telegram Mini App");
        }
      });
    </script>
  </body>
</html>
