<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#000000">
    <title>Odysape - Telegram Mini App Game</title>

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: #000;
        }

        #unity-loading-bar {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        #unity-logo {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="%232481cc"/><text x="50" y="65" font-size="48" text-anchor="middle" fill="white" font-family="Arial">O</text></svg>') no-repeat center;
            background-size: contain;
        }

        #unity-progress-bar-container {
            width: 200px;
            height: 10px;
            background: #333;
            border-radius: 5px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        #unity-progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #2481cc, #5ba3e0);
            transition: width 0.3s ease;
            border-radius: 5px;
        }

        #unity-progress-text {
            color: #fff;
            font-size: 14px;
            text-align: center;
        }

        #unity-error {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            padding: 20px;
            background: #d32f2f;
            color: white;
            border-radius: 10px;
            display: none;
            max-width: 80%;
            text-align: center;
        }

        /* Hide loading when game starts */
        .loaded #unity-loading-bar {
            display: none;
        }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas"></canvas>

        <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-container">
                <div id="unity-progress-bar"></div>
            </div>
            <div id="unity-progress-text">Loading... 0%</div>
        </div>

        <div id="unity-error">
            <h3>Error Loading Game</h3>
            <p id="unity-error-message"></p>
            <button onclick="location.reload()" style="margin-top: 10px; padding: 10px 20px; background: white; color: #d32f2f; border: none; border-radius: 5px; cursor: pointer;">Reload</button>
        </div>
    </div>

    <script>
        // Telegram Web App initialization
        let tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            console.log('Telegram Web App initialized');
        } else {
            console.warn('Not running in Telegram environment');
        }

        // Unity WebGL configuration
        const buildUrl = "Build";
        const config = {
             dataUrl: buildUrl + "/Test.data",
            frameworkUrl: buildUrl + "/Test.framework.js",
            codeUrl: buildUrl + "/Test.wasm",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "DefaultCompany",
            productName: "odysape-unity-client-main",
            productVersion: "1.0",
        };

        // Progress tracking
        const progressBar = document.getElementById('unity-progress-bar');
        const progressText = document.getElementById('unity-progress-text');
        const loadingBar = document.getElementById('unity-loading-bar');
        const errorDiv = document.getElementById('unity-error');
        const errorMessage = document.getElementById('unity-error-message');
        const container = document.getElementById('unity-container');

        function updateProgress(progress) {
            const percent = Math.round(progress * 100);
            progressBar.style.width = percent + '%';
            progressText.textContent = `Loading... ${percent}%`;
        }

        function showError(message) {
            console.error('Unity Error:', message);
            loadingBar.style.display = 'none';
            errorDiv.style.display = 'block';
            errorMessage.textContent = message;

            // Notify Telegram if available
            if (tg) {
                tg.showAlert('Failed to load game: ' + message);
            }
        }

        // Load Unity WebGL
        const loaderUrl = buildUrl + "/odysape.loader.js";
        const script = document.createElement("script");
        script.src = loaderUrl;

        script.onload = () => {
            createUnityInstance(document.querySelector("#unity-canvas"), config, updateProgress)
                .then((unityInstance) => {
                    window.unityInstance = unityInstance;
                    container.classList.add('loaded');
                    console.log('Unity instance created successfully');

                    // Notify Telegram
                    if (tg) {
                        tg.MainButton.setText('Game Loaded');
                    }
                })
                .catch((message) => {
                    showError(message);
                });
        };

        script.onerror = () => {
            showError('Failed to load game loader script');
        };

        document.body.appendChild(script);

        // Handle visibility changes
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                console.log('Game hidden');
            } else {
                console.log('Game visible');
            }
        });

        // Prevent accidental navigation
        window.addEventListener('beforeunload', (e) => {
            if (window.unityInstance) {
                e.preventDefault();
                e.returnValue = '';
            }
        });

        // Resize handler
        window.addEventListener('resize', () => {
            if (window.unityInstance) {
                // Unity handles this automatically
                console.log('Window resized');
            }
        });
    </script>
</body>
</html>
